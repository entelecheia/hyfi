---
name: lint & test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make docs-test

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync pytest --cov --cov-report=term-missing
      - name: Installed wheel works outside the checkout
        run: |
          uv build
          wheel="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          uvx --from "$wheel" hyfi --version
          uvx --from "$wheel" hyfi config show --json

  dependency-bounds:
    name: deps ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lowest-direct
            python: "3.11"
            args: --resolution lowest-direct
          - name: pre-release (hydra 1.4)
            python: "3.14"
            args: --prerelease allow --with 'hydra-core>=1.4.0rc1'
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv run --isolated ${{ matrix.args }} --no-default-groups --group test python -c "import hydra, omegaconf, pydantic; print(hydra.__version__, omegaconf.__version__, pydantic.VERSION)"
      - run: uv run --isolated ${{ matrix.args }} --no-default-groups --group test pytest -q
