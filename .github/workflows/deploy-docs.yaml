---
name: deploy-docs

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths: ["README.md", "mkdocs.yaml", "docs/**", "src/**", ".github/workflows/deploy-docs.yaml"]

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv run --no-sync mkdocs gh-deploy --force
