site_name: "HyFI: Hydra Fast Interface"
site_url: https://hyfi.entelecheia.ai
site_author: Young Joon Lee
site_description: Compose Hydra configs, validate them with Pydantic, and run reproducible workflows
repo_name: entelecheia/hyfi
repo_url: https://github.com/entelecheia/hyfi
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2023 Young Joon Lee

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.highlight
  favicon: https://assets.entelecheia.ai/favicon.png
  logo: https://assets.entelecheia.ai/logo.png

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - Usage: usage.md
  - Writing a plugin: plugins.md
  - Agents: agents.md
  - Migrating from 1.x: migration.md
  - API: api.md
