---
name: docs

# The docs build reads docs/, README.md (included in the index), and src/ docstrings,
# so it runs on exactly those changes; lint & test ignores docs-only changes.
on:
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "*.md", "mkdocs.yaml", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yaml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1" # pin the uv CLI; bump with uv.lock-affecting changes
          python-version: "3.13"
          enable-cache: true
          cache-python: true
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv run --no-sync mkdocs build --strict
