[project]
name = "hyfi"
version = "1.37.0"
description = "HyFI: compose Hydra configs, validate them with Pydantic, and run reproducible workflows"
authors = [{ name = "Young Joon Lee", email = "entelecheia@hotmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["hydra", "pydantic", "configuration", "workflow", "reproducibility"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "hydra-core>=1.3.7",
    "omegaconf>=2.3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://hyfi.entelecheia.ai"
Repository = "https://github.com/entelecheia/hyfi"
Documentation = "https://hyfi.entelecheia.ai"
Changelog = "https://github.com/entelecheia/hyfi/blob/main/CHANGELOG.md"

[project.scripts]
hyfi = "hyfi.cli:main"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.15", "mypy>=1.13"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "docs" }]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyfi"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["src/hyfi"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:hyfi.*"]

[tool.coverage.run]
branch = true
source = ["hyfi"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_source = "tag"
commit_message = ":rocket: {version}\n\nAutomatically generated by python-semantic-release"
build_command = "pip install uv==0.13.1 && uv build"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/hyfi/_version.py:__version__"]

[tool.semantic_release.branches.main]
match = "release"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!--next-version-placeholder-->"
mode = "update"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
